<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Toolkit Pro · Herramientas online</title>
    <meta name="theme-color" content="#4f46e5">
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Inter for a clean, modern look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Estilo: limpio y profesional (índigo sobre fondo claro) -->
    <style>
        :root {
            --bg: #f5f6fb; --surface: #ffffff; --ink: #1e1b4b; --text: #334155; --muted: #64748b;
            --line: #e5e7f0; --primary: #4f46e5; --primary-dark: #4338ca; --primary-soft: #eef2ff;
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
        h1, h2, h3 { color: var(--ink); letter-spacing: -0.01em; }

        .card {
            background: var(--surface);
            border: 1px solid var(--line);
            box-shadow: 0 1px 2px rgba(30, 27, 75, 0.04), 0 8px 24px rgba(30, 27, 75, 0.05);
            transition: box-shadow 0.25s ease, transform 0.25s ease;
        }
        .card:hover { box-shadow: 0 2px 4px rgba(30, 27, 75, 0.05), 0 14px 32px rgba(79, 70, 229, 0.10); transform: translateY(-2px); }

        .card-hero { background: linear-gradient(135deg, #4f46e5 0%, #6366f1 60%, #818cf8 100%); border: none; color: #fff; }
        .card-hero h2 { color: #fff !important; }
        .card-hero .hero-sub { color: #e0e7ff; }
        .card-hero .tile { background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.22); }
        .card-hero .tile-label { color: #e0e7ff; }
        .card-hero .tile-value { color: #fff; }
        .card-hero label { color: #e0e7ff !important; }
        .card-hero .input-field { background: rgba(255,255,255,0.95); border-color: transparent; }
        .card-hero .btn-secondary { background: rgba(255,255,255,0.18); color: #fff; border: 1px solid rgba(255,255,255,0.3); }
        .card-hero .btn-secondary:hover { background: rgba(255,255,255,0.28); }
        .card-hero .result-box { background: #fff; border: none; color: var(--ink) !important; font-weight: 600; }

        .input-field, .textarea-field {
            background-color: #fff; border: 1px solid #d6d9e6; color: var(--ink);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .input-field:focus, .textarea-field:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15); }
        .input-field::placeholder { color: #9aa3b8; }

        .btn { background: var(--primary); color: #fff; transition: background 0.2s ease, transform 0.1s ease; box-shadow: 0 1px 2px rgba(79,70,229,0.25); }
        .btn:hover { background: var(--primary-dark); }
        .btn:active { transform: scale(0.98); }
        .btn-secondary { background: var(--primary-soft); color: var(--primary-dark) !important; transition: background 0.2s ease, transform 0.1s ease; }
        .btn-secondary:hover { background: #e0e7ff; }
        .btn-secondary:active { transform: scale(0.98); }
        .btn-secondary svg { stroke: var(--primary-dark); }

        .result-box {
            background-color: #f8f9fd; border: 1px solid var(--line); min-height: 50px;
            font-family: 'Inter', sans-serif; word-wrap: break-word; color: var(--ink) !important;
        }
        .stat { background: #f8f9fd; border: 1px solid var(--line); }
        .stat-label { color: var(--muted); }
        .stat-value { color: var(--ink); font-weight: 600; }
        .stat-good { color: #059669; font-weight: 600; }
        .field-label { color: var(--text); }
        .section-title { color: var(--ink); }

        .calc-btn {
            background: #f4f5fa; border: 1px solid var(--line); font-size: 1.25rem; padding: 1rem 0;
            border-radius: 0.75rem; transition: background 0.15s ease, transform 0.1s ease; color: var(--ink);
        }
        .calc-btn:hover { background: #eceef6; }
        .calc-btn:active, .calc-btn.keyboard-active { transform: scale(0.96); background: #e2e5f0; }
        .calc-operator { background: var(--primary-soft); color: var(--primary-dark); font-weight: 600; }
        .calc-operator:hover { background: #e0e7ff; }
        .calc-special { background: #fff1f2; color: #e11d48; border-color: #ffe4e6; }
        .calc-special:hover { background: #ffe4e6; }
        .calc-equals { background: var(--primary); color: #fff; font-weight: 600; border-color: var(--primary); }
        .calc-equals:hover { background: var(--primary-dark); }
        #calculator-display { background: var(--ink); color: #fff; border-radius: 0.75rem; }
        .history-item:hover { background-color: var(--primary-soft); }
    </style>
</head>
<body class="min-h-screen w-full p-4 sm:p-8 flex flex-col items-center">

    <!-- Header -->
    <header class="text-center mb-12 w-full max-w-6xl">
        <div class="flex justify-between items-start">
             <div id="userInfo" class="flex items-center justify-center sm:justify-start gap-4 mb-4" style="color:var(--muted)">
                <img id="user-flag" src="" alt="Bandera del país" class="w-8 h-auto rounded-md hidden" onerror="this.style.display='none'"/>
                <div class="text-sm text-left">
                    <span id="current-date" >Cargando fecha...</span>
                    <span id="current-time" class="block sm:inline-block sm:ml-2 font-mono px-2 py-1 rounded" style="background:var(--primary-soft);color:var(--primary-dark)" >Cargando hora...</span>
                </div>
            </div>
            <div class="relative">
                <select id="language-selector" class="input-field appearance-none p-2 rounded-lg pr-8">
                    <option value="es">Español</option>
                    <option value="en">English</option>
                </select>
            </div>
        </div>
        
        <h1 class="text-4xl md:text-5xl font-bold tracking-tight" style="color:var(--ink)" data-translate-key="main_title">
            Digital Toolkit Pro
        </h1>
        <p class="text-lg mt-2" style="color:var(--muted)" data-translate-key="subtitle">Herramientas online útiles</p>
    </header>

    <!-- Main Grid for Tools -->
    <main class="w-full max-w-7xl grid grid-cols-1 lg:grid-cols-2 gap-8">

        <!-- Indicadores Chile: Dólar / Euro / UF / UTM -->
        <div class="card card-hero lg:col-span-2 rounded-2xl p-6 md:p-8">
            <h2 class="text-xl font-semibold mb-1" data-translate-key="indicators_title"></h2>
            <p id="indicatorsStatus" class="hero-sub text-sm mb-4"></p>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6 text-center">
                <div class="tile p-3 rounded-xl"><span id="indDolarLabel" class="tile-label block text-xs" data-translate-key="dollar_label"></span><span id="indDolar" class="tile-value text-2xl font-semibold">-</span></div>
                <div class="tile p-3 rounded-xl"><span class="tile-label block text-xs">Euro</span><span id="indEuro" class="tile-value text-2xl font-semibold">-</span></div>
                <div class="tile p-3 rounded-xl"><span class="tile-label block text-xs">UF</span><span id="indUf" class="tile-value text-2xl font-semibold">-</span></div>
                <div class="tile p-3 rounded-xl"><span class="tile-label block text-xs">UTM</span><span id="indUtm" class="tile-value text-2xl font-semibold">-</span></div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
                <div>
                    <label for="indAmount" class="field-label block mb-2 text-sm font-medium" data-translate-key="amount_label"></label>
                    <input type="number" id="indAmount" class="input-field w-full p-3 rounded-lg" value="1">
                </div>
                <div>
                    <label for="indCurrency" class="field-label block mb-2 text-sm font-medium" data-translate-key="indicator_label"></label>
                    <select id="indCurrency" class="input-field w-full p-3 rounded-lg">
                        <option value="dolar">USD (Dólar)</option>
                        <option value="euro">EUR (Euro)</option>
                        <option value="uf">UF</option>
                        <option value="utm">UTM</option>
                    </select>
                </div>
                <div>
                    <button id="indSwap" class="btn-secondary w-full text-white font-semibold py-3 px-4 rounded-lg">⇄ <span id="indDirection"></span></button>
                </div>
            </div>
            <div id="indResult" class="result-box p-4 rounded-lg text-xl mt-4 text-center">-</div>
        </div>
        
        <!-- Converters Column -->
        <div class="card rounded-2xl p-6 md:p-8 space-y-8">
            <!-- Number to Text Section -->
            <div>
                <h2 class="section-title text-xl font-semibold mb-4" data-translate-key="num_to_text_title"></h2>
                <div class="space-y-4">
                    <input type="number" id="numToTextInput" class="input-field w-full p-3 rounded-lg" data-translate-key-placeholder="num_to_text_placeholder">
                    <div class="flex flex-col sm:flex-row gap-4">
                        <button id="toUpperBtn" class="btn-secondary w-full text-white font-semibold py-2 px-4 rounded-lg" data-translate-key="uppercase_btn"></button>
                        <button id="toLowerBtn" class="btn-secondary w-full text-white font-semibold py-2 px-4 rounded-lg" data-translate-key="lowercase_btn"></button>
                    </div>
                    <div class="flex items-center gap-2">
                        <div id="numToTextResult" class="result-box p-4 rounded-lg w-full"></div>
                        <button id="copyNumToTextBtn" class="btn-secondary p-3 rounded-lg flex-shrink-0" data-translate-key-title="copy_result_title">
                            <svg class="clipboard-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Text to Number Section -->
            <div>
                <h2 class="section-title text-xl font-semibold mb-4" data-translate-key="text_to_num_title"></h2>
                <div class="space-y-4">
                    <input type="text" id="textToNumInput" class="input-field w-full p-3 rounded-lg" data-translate-key-placeholder="text_to_num_placeholder">
                    <button id="textToNumBtn" class="btn w-full text-white font-bold py-3 px-4 rounded-lg" data-translate-key="convert_to_num_btn"></button>
                    <div id="textToNumResult" class="result-box p-4 rounded-lg"></div>
                </div>
            </div>
        </div>

        <!-- Calculators Column -->
        <div class="card rounded-2xl p-6 md:p-8">
            <h2 class="section-title text-xl font-semibold mb-4" data-translate-key="vat_calculator_title"></h2>
            <div class="space-y-6">
                <div>
                    <label for="countryVat" class="field-label block mb-2 text-sm font-medium" data-translate-key="country_vat_label"></label>
                    <select id="countryVat" class="input-field w-full p-3 rounded-lg"></select>
                </div>
                <div id="customVatContainer" class="hidden">
                    <label for="customVatInput" class="field-label block mb-2 text-sm font-medium" data-translate-key="custom_vat_label"></label>
                    <input type="number" id="customVatInput" class="input-field w-full p-3 rounded-lg" data-translate-key-placeholder="custom_vat_placeholder">
                </div>
                <div>
                    <label for="amountInput" class="field-label block mb-2 text-sm font-medium" data-translate-key="amount_label"></label>
                    <input type="number" id="amountInput" class="input-field w-full p-3 rounded-lg" data-translate-key-placeholder="amount_placeholder">
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <button id="calculateFromNet" class="btn text-white font-bold py-3 px-4 rounded-lg" data-translate-key="calc_from_net_btn"></button>
                    <button id="calculateFromTotal" class="btn text-white font-bold py-3 px-4 rounded-lg" data-translate-key="calc_from_total_btn"></button>
                </div>
                <div class="space-y-4 pt-4 border-t" style="border-color:var(--line)">
                    <h3 class="text-base font-semibold section-title" data-translate-key="results_title"></h3>
                    <div class="grid grid-cols-3 gap-2 text-center text-sm">
                        <div class="stat p-2 rounded-lg"><span class="stat-label block text-xs" data-translate-key="net_label"></span><span id="resultNet" class="stat-value text-lg">-</span></div>
                        <div class="stat p-2 rounded-lg"><span class="stat-label block text-xs" data-translate-key="vat_label"></span><span id="resultVat" class="stat-value text-lg">-</span></div>
                        <div class="stat p-2 rounded-lg"><span class="stat-label block text-xs" data-translate-key="total_label"></span><span id="resultTotal" class="stat-value text-lg">-</span></div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Modern Calculator -->
        <div class="card lg:col-span-2 rounded-2xl p-6 md:p-8">
            <h2 class="section-title text-xl font-semibold mb-4" data-translate-key="modern_calculator_title"></h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="md:col-span-2">
                    <div id="calculator-display" class="text-right text-4xl p-4 rounded-t-lg font-mono break-all">0</div>
                    <div class="grid grid-cols-4 gap-2 mt-2">
                        <button class="calc-btn calc-special" data-key="clear">C</button>
                        <button class="calc-btn calc-special" data-key="backspace">DEL</button>
                        <button class="calc-btn calc-operator" data-key="%">%</button>
                        <button class="calc-btn calc-operator" data-key="/">÷</button>
                        <button class="calc-btn" data-key="7">7</button>
                        <button class="calc-btn" data-key="8">8</button>
                        <button class="calc-btn" data-key="9">9</button>
                        <button class="calc-btn calc-operator" data-key="*">×</button>
                        <button class="calc-btn" data-key="4">4</button>
                        <button class="calc-btn" data-key="5">5</button>
                        <button class="calc-btn" data-key="6">6</button>
                        <button class="calc-btn calc-operator" data-key="-">-</button>
                        <button class="calc-btn" data-key="1">1</button>
                        <button class="calc-btn" data-key="2">2</button>
                        <button class="calc-btn" data-key="3">3</button>
                        <button class="calc-btn calc-operator" data-key="+">+</button>
                        <button class="calc-btn col-span-2" data-key="0">0</button>
                        <button class="calc-btn" data-key=".">.</button>
                        <button class="calc-btn calc-equals" data-key="=">=</button>
                    </div>
                </div>
                <div class="md:col-span-1">
                     <h3 class="text-lg font-semibold mb-2" data-translate-key="history_title"></h3>
                     <div id="calculator-history" class="result-box h-48 p-2 rounded-lg space-y-1 overflow-y-auto"></div>
                     <button id="clear-history-btn" class="btn-secondary w-full mt-2 py-2 rounded-lg text-sm" data-translate-key="clear_history_btn"></button>
                </div>
            </div>
        </div>

        <!-- Discount & Unit Converters -->
        <div class="card rounded-2xl p-6 md:p-8">
            <h2 class="section-title text-xl font-semibold mb-4" data-translate-key="discount_calculator_title"></h2>
            <div class="space-y-6">
                <div>
                    <label for="originalPriceInput" class="field-label block mb-2 text-sm font-medium" data-translate-key="original_price_label"></label>
                    <input type="number" id="originalPriceInput" class="input-field w-full p-3 rounded-lg" data-translate-key-placeholder="original_price_placeholder">
                </div>
                <div>
                    <label for="discountPercentageInput" class="field-label block mb-2 text-sm font-medium" data-translate-key="discount_percentage_label"></label>
                    <input type="number" id="discountPercentageInput" class="input-field w-full p-3 rounded-lg" data-translate-key-placeholder="discount_percentage_placeholder">
                </div>
                <button id="calculateDiscountBtn" class="btn w-full text-white font-bold py-3 px-4 rounded-lg" data-translate-key="calculate_discount_btn"></button>
                <div class="space-y-4 pt-4 border-t" style="border-color:var(--line)">
                    <h3 class="text-base font-semibold section-title" data-translate-key="results_title"></h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-center text-sm">
                        <div class="stat p-3 rounded-xl"><span class="stat-label block text-xs" data-translate-key="saved_amount_label"></span><span id="savedAmount" class="stat-good text-xl">-</span></div>
                        <div class="stat p-3 rounded-xl"><span class="stat-label block text-xs" data-translate-key="final_price_label"></span><span id="finalPrice" class="stat-value text-xl">-</span></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card rounded-2xl p-6 md:p-8">
            <h2 class="section-title text-xl font-semibold mb-4" data-translate-key="unit_converter_title"></h2>
            <div class="space-y-4">
                 <div>
                    <label for="unitCategory" class="field-label block mb-2 text-sm font-medium" data-translate-key="measurement_type_label"></label>
                    <select id="unitCategory" class="input-field w-full p-3 rounded-lg"></select>
                </div>
                <div class="flex items-center gap-4">
                    <div class="w-full">
                        <label for="fromUnit" class="field-label block mb-2 text-sm font-medium" data-translate-key="from_label"></label>
                        <select id="fromUnit" class="input-field w-full p-3 rounded-lg"></select>
                    </div>
                    <div class="w-full">
                         <label for="toUnit" class="field-label block mb-2 text-sm font-medium" data-translate-key="to_label"></label>
                        <select id="toUnit" class="input-field w-full p-3 rounded-lg"></select>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <input type="number" id="fromValue" class="input-field w-full p-3 rounded-lg" data-translate-key-placeholder="value_placeholder">
                    <input type="text" id="toValue" class="input-field w-full p-3 rounded-lg" readonly data-translate-key-placeholder="result_placeholder">
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="mt-12 text-center text-sm" style="color:var(--muted)">
        <p data-translate-key="footer_text">&copy; 2025 Digital Toolkit Pro</p>
    </footer>

            // Declare all DOM element constants at the top of the scope.
            const userFlag = document.getElementById('user-flag');
            const currentDateEl = document.getElementById('current-date');

            const languageSelector = document.getElementById('language-selector');

            function toWordsEN(num) { if (num === 0) return 'zero'; if (num < 0) return "negative " + toWordsEN(Math.abs(num)); if (String(num).length > 15) return "Number too large"; const ones = ['', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen']; const tens = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety']; const scales = ['', 'thousand', 'million', 'billion', 'trillion']; let numStr = String(num); let result = []; for (let i = 0; numStr.length > 0; i++) { let chunk = numStr.slice(Math.max(0, numStr.length - 3)); numStr = numStr.slice(0, numStr.length - 3); if (Number(chunk) !== 0) { let chunkWords = []; let n = Number(chunk); let h = Math.floor(n / 100); let t = n % 100; if (h > 0) { chunkWords.push(ones[h], 'hundred'); } if (t > 0) { if (t < 20) { chunkWords.push(ones[t]); } else { chunkWords.push(tens[Math.floor(t / 10)]); let o = t % 10; if (o > 0) { chunkWords.push(ones[o]); } } } if (scales[i]) { chunkWords.push(scales[i]); } result.unshift(chunkWords.join(' ')); } } return result.join(' ').replace(/\s+/g, ' ').trim(); }
            
            function toWordsES(num) {
                if (num === 0) return 'cero';
                if (num < 0) return 'menos ' + toWordsES(Math.abs(num));
                if (String(num).length > 15) return "Número demasiado grande";

                const UNI = ['', 'uno', 'dos', 'tres', 'cuatro', 'cinco', 'seis', 'siete', 'ocho', 'nueve', 'diez', 'once', 'doce', 'trece', 'catorce', 'quince', 'dieciséis', 'diecisiete', 'dieciocho', 'diecinueve', 'veinte', 'veintiuno', 'veintidós', 'veintitrés', 'veinticuatro', 'veinticinco', 'veintiséis', 'veintisiete', 'veintiocho', 'veintinueve'];
                const DEC = ['', '', '', 'treinta', 'cuarenta', 'cincuenta', 'sesenta', 'setenta', 'ochenta', 'noventa'];
                const CEN = ['', 'ciento', 'doscientos', 'trescientos', 'cuatrocientos', 'quinientos', 'seiscientos', 'setecientos', 'ochocientos', 'novecientos'];

                // Convierte 1..999. "apocope" = true cambia "uno" final por "un"/"ún" (antes de mil/millones)
                function menorMil(n, apocope) {
                    if (n === 100) return 'cien';
                    const c = Math.floor(n / 100), r = n % 100;
                    let w = c > 0 ? CEN[c] : '';
                    let rw = '';
                    if (r > 0 && r < 30) rw = UNI[r];
                    else if (r >= 30) rw = DEC[Math.floor(r / 10)] + (r % 10 ? ' y ' + UNI[r % 10] : '');
                    if (apocope) {
                        if (rw === 'veintiuno') rw = 'veintiún';
                        else rw = rw.replace(/(^| )uno$/, '$1un');
                    }
                    return (w + ' ' + rw).trim();
                }

                // Convierte 0..999.999 (miles)
                function menorMillon(n, apocope) {
                    const miles = Math.floor(n / 1000), resto = n % 1000;
                    let parts = [];
                    if (miles === 1) parts.push('mil');
                    else if (miles > 1) parts.push(menorMil(miles, true) + ' mil');
                    if (resto > 0) parts.push(menorMil(resto, apocope));
                    return parts.join(' ');
                }

                // Español usa escala larga: millón = 10^6, billón = 10^12
                const billones = Math.floor(num / 1e12);
                const millones = Math.floor((num % 1e12) / 1e6);
                const resto = num % 1e6;
                let parts = [];
                if (billones > 0) parts.push(billones === 1 ? 'un billón' : menorMillon(billones, true) + ' billones');
                if (millones > 0) parts.push(millones === 1 ? 'un millón' : menorMillon(millones, true) + ' millones');
                if (resto > 0) parts.push(menorMillon(resto, false));
                return parts.join(' ').replace(/\s+/g, ' ').trim();
            }
            
            const convertNumToText = (casing) => {
                const value = numToTextInput.value;
                if(value === '') return;
                // Ajustado para permitir números más grandes si la función lo soporta, pero manteniendo el límite de 12 dígitos como referencia.
                if (!/^-?\d+$/.test(value)) {
                    numToTextResult.textContent = translations[currentLang].integers_only;

                if (value.replace('-', '').length > 12) {

                let text;
                if (currentLang === 'en') {

                    text = toWordsES(Number(value));

                numToTextResult.textContent = casing === 'upper' ? text.toUpperCase() : text.toLowerCase();
            };

            function textoANumero(texto) {
                const quitarTildes = t => t.normalize('NFD').replace(/[̀-ͯ]/g, '');
                const wordMap = {'cero':0,'uno':1,'un':1,'una':1,'dos':2,'tres':3,'cuatro':4,'cinco':5,'seis':6,'siete':7,'ocho':8,'nueve':9,'diez':10,'once':11,'doce':12,'trece':13,'catorce':14,'quince':15,'dieciseis':16,'diecisiete':17,'dieciocho':18,'diecinueve':19,'veinte':20,'veintiuno':21,'veintiun':21,'veintidos':22,'veintitres':23,'veinticuatro':24,'veinticinco':25,'veintiseis':26,'veintisiete':27,'veintiocho':28,'veintinueve':29,'treinta':30,'cuarenta':40,'cincuenta':50,'sesenta':60,'setenta':70,'ochenta':80,'noventa':90,'cien':100,'ciento':100,'doscientos':200,'trescientos':300,'cuatrocientos':400,'quinientos':500,'seiscientos':600,'setecientos':700,'ochocientos':800,'novecientos':900};
                const bigMap = {'millon':1e6,'millones':1e6,'billon':1e12,'billones':1e12};
                const tokens = quitarTildes(texto.toLowerCase()).replace(/[,.]/g, ' ').split(/\s+/).filter(t => t && t !== 'y');
                if (tokens.length === 0) return '';
                let total = 0, grupo = 0, actual = 0;

                for (const t of tokens) {

            function getVatRate() { /* Unchanged */ const selection = countryVatSelect.value; if (selection === 'custom') { const customRate = parseFloat(customVatInput.value); return isNaN(customRate) ? 0 : customRate / 100; } else { return parseFloat(selection.split('_')[0]); } }

            function convertUnits() {
                const category = unitCategory.value;
                const val = parseFloat(fromValue.value);
                const fromUKey = fromUnit.value;
                const toUKey = toUnit.value;
                
                if (isNaN(val) || !fromUKey || !toUKey) {
                    toValue.value = '';
                    return;
                }

                let result;

                if (category === 'temperatura') {
                    const fromType = unitData.temperatura[fromUKey];
                    const toType = unitData.temperatura[toUKey];
                    if (fromType === 'celsius') {
                        if (toType === 'fahrenheit') result = (val * 9/5) + 32;
                        else if (toType === 'kelvin') result = val + 273.15;
                        else result = val;
                    } else if (fromType === 'fahrenheit') {
                        if (toType === 'celsius') result = (val - 32) * 5/9;
                        else if (toType === 'kelvin') result = (val - 32) * 5/9 + 273.15;
                        else result = val;
                    } else if (fromType === 'kelvin') {
                        if (toType === 'celsius') result = val - 273.15;
                        else if (toType === 'fahrenheit') result = (val - 273.15) * 9/5 + 32;
                        else result = val;
                    }
                } else {
                    const fromFactor = unitData[category][fromUKey];
                    const toFactor = unitData[category][toUKey];
                    const baseValue = val * fromFactor;

            function handleCalcInput(key) {
                const lastChar = currentInput.slice(-1);

                if (key === 'clear' || key === 'Escape') {
                    currentInput = '0';
                } else if (key === 'backspace' || key === 'Backspace') {
                    currentInput = currentInput.length > 1 ? currentInput.slice(0, -1) : '0';

                    try {
                        const expression = currentInput.replace(/×/g, '*').replace(/÷/g, '/');
                        if (/[^0-9+\-*/.%() ]/.test(expression)) {
                            throw new Error("Invalid characters");
                        }
                        const rawResult = new Function('return ' + expression)();
                        if (!isFinite(rawResult)) throw new Error("Division by zero");
                        const result = parseFloat(rawResult.toFixed(10));
                        history.push({ expression: currentInput, result: result.toLocaleString(currentLang), rawResult: result });
                        if (history.length > 10) history.shift();
                        updateHistory();
                        currentInput = String(result);
                        justEvaluated = true;
                        updateDisplay();
                        return;
                    } catch (error) {
                        currentInput = 'Error';
                    }
                } else if (['+', '-', '×', '÷', '*', '/'].includes(key)) {
                    let operator = key;
                    if (key === '*') operator = '×';
                    if (key === '/') operator = '÷';
                    
                    if (currentInput === 'Error') currentInput = '0';
                    if (['+', '-', '×', '÷'].includes(lastChar)) {
                        currentInput = currentInput.slice(0, -1) + operator; // reemplaza el operador anterior
                    } else {
                        currentInput += operator;
                    }

                    const m = currentInput.match(/(\d*\.?\d+)$/);
                    if (m) {
                        currentInput = currentInput.slice(0, -m[1].length) + String(parseFloat(m[1]) / 100);

                    if (currentInput === '0' || currentInput === 'Error' || justEvaluated) {
                        currentInput = key;
                    } else {
                        currentInput += key;

                else if (key === 'Backspace') buttonKey = 'backspace';
                else if (key === 'Escape') buttonKey = 'clear';

                if(buttonKey) {
                    event.preventDefault();
                    handleCalcInput(buttonKey);
                    const button = document.querySelector(`.calc-btn[data-key="${buttonKey}"]`) || document.querySelector(`.calc-btn[data-key="${key === '*' ? '×' : key === '/' ? '÷' : ''}"]`);
                    if(button) {
                        button.classList.add('keyboard-active');
                        setTimeout(() => button.classList.remove('keyboard-active'), 100);
                    }
                }
            });


            // --- INDICADORES CHILE (mindicador.cl) ---
            const ind = { data: null, dateStr: '', status: 'loading', source: '', toClp: true };
            const indEls = { status: document.getElementById('indicatorsStatus'), dolar: document.getElementById('indDolar'), euro: document.getElementById('indEuro'), uf: document.getElementById('indUf'), utm: document.getElementById('indUtm'), amount: document.getElementById('indAmount'), cur: document.getElementById('indCurrency'), swap: document.getElementById('indSwap'), dir: document.getElementById('indDirection'), result: document.getElementById('indResult') };
            const fmtClp = v => '$' + v.toLocaleString('es-CL', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

            function renderIndicators() {
                const t = translations[currentLang];
                indEls.dir.textContent = ind.toClp ? t.to_clp : t.from_clp;
                document.getElementById('indDolarLabel').textContent = ind.source === 'intl' ? t.dollar_market_label : t.dollar_label;
                if (ind.status === 'loading') indEls.status.textContent = t.ind_loading;
                else if (ind.status === 'error') indEls.status.textContent = t.ind_error;
                else indEls.status.textContent = (ind.status === 'cached' ? t.ind_cached : (ind.source === 'intl' ? t.ind_updated_intl : t.ind_updated)) + ' ' + ind.dateStr;
                if (!ind.data) { indEls.result.textContent = '-'; return; }
                for (const k of ['dolar', 'euro', 'uf', 'utm']) indEls[k].textContent = ind.data[k] ? fmtClp(ind.data[k]) : '-';
                const amount = parseFloat(indEls.amount.value);
                const rate = ind.data[indEls.cur.value];
                if (isNaN(amount) || !rate) { indEls.result.textContent = '-'; return; }
                const code = indEls.cur.value === 'dolar' ? 'USD' : indEls.cur.value === 'euro' ? 'EUR' : indEls.cur.value.toUpperCase();
                const n = v => v.toLocaleString(currentLang, { maximumFractionDigits: 4 });
                indEls.result.textContent = ind.toClp
                    ? `${n(amount)} ${code} = ${fmtClp(amount * rate)} CLP`
                    : `${fmtClp(amount)} CLP = ${n(amount / rate)} ${code}`;
            }

            async function fetchJson(url) {
                const r = await fetch(url);
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.json();
            }

            async function loadIndicators() {
                try {
                    // 1) Archivo propio actualizado por GitHub Actions desde el Banco Central
                    const f = await fetchJson('data/indicadores.json?t=' + Date.now());
                    if (!f.dolar) throw new Error('Archivo sin datos');
                    ind.data = { dolar: f.dolar, euro: f.euro, uf: f.uf, utm: f.utm };
                    const [y, m, d] = f.fecha.split('-');
                    ind.dateStr = `${d}-${m}-${y}`;
                    ind.source = 'bcch';
                    ind.status = 'ok';
                } catch (err0) {
                console.warn('Archivo de indicadores no disponible:', err0);
                try {
                    // Fuente principal: mindicador.cl (Banco Central de Chile; incluye UF y UTM)
                    const d = await fetchJson('https://mindicador.cl/api');
                    if (!d.dolar || !d.dolar.valor) throw new Error('Respuesta sin datos');
                    ind.data = { dolar: d.dolar.valor, euro: d.euro && d.euro.valor, uf: d.uf && d.uf.valor, utm: d.utm && d.utm.valor };
                    ind.dateStr = new Date(d.dolar.fecha).toLocaleDateString('es-CL', { timeZone: 'UTC' });
                    ind.source = 'bcch';
                    ind.status = 'ok';
                } catch (err) {
                    console.warn('mindicador.cl no disponible, usando respaldo:', err);
                    try {
                        // Respaldo: open.er-api.com (solo dólar y euro; UF y UTM desde lo último guardado)
                        const e = await fetchJson('https://open.er-api.com/v6/latest/USD');
                        const clp = e.rates && e.rates.CLP, eur = e.rates && e.rates.EUR;
                        if (!clp) throw new Error('Respuesta sin CLP');
                        let prev = null;
                        try { prev = JSON.parse(localStorage.getItem('indicadores')); } catch (x) {}
                        ind.data = { dolar: clp, euro: eur ? clp / eur : null, uf: prev && prev.data ? prev.data.uf : null, utm: prev && prev.data ? prev.data.utm : null };
                        ind.dateStr = new Date(e.time_last_update_unix * 1000).toLocaleDateString('es-CL');
                        ind.source = 'intl';
                        ind.status = 'ok';
                    } catch (err2) {
                        console.error('No se pudieron obtener los indicadores:', err2);
                        let cached = null;
                        try { cached = JSON.parse(localStorage.getItem('indicadores')); } catch (x) {}
                        if (cached && cached.data) { ind.data = cached.data; ind.dateStr = cached.dateStr; ind.status = 'cached'; }
                        else ind.status = 'error';
                    }
                }
                }
                if (ind.status === 'ok' && ind.source === 'bcch') {
                    try { localStorage.setItem('indicadores', JSON.stringify({ data: ind.data, dateStr: ind.dateStr })); } catch (x) {}
                }
                renderIndicators();
            }

            indEls.amount.addEventListener('input', renderIndicators);
            indEls.cur.addEventListener('change', renderIndicators);
            indEls.swap.addEventListener('click', () => { ind.toClp = !ind.toClp; renderIndicators(); });
            languageSelector.addEventListener('change', renderIndicators);

            // --- INITIALIZATION ---
            initializeApp();
            renderIndicators();
            loadIndicators();

        });
    </script>
</body>
</html>
